<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单摆简谐振动模拟器 · Week05</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a24;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
      padding: 16px 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    header {
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f0f4f8;
      letter-spacing: 1px;
    }
    .subtitle {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #7f8ba3;
      font-family: Consolas, Menlo, monospace;
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 12px 24px;
      background: rgba(30, 30, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 820px;
      max-width: 94vw;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: #90caf9;
      font-weight: 500;
    }
    .val-display {
      color: #fff;
      font-family: Consolas, Menlo, monospace;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 150px;
      height: 6px;
      border-radius: 3px;
      background: #33334d;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
    }
    .btn-reset {
      background: linear-gradient(135deg, #00b8d4 0%, #0097a7 100%);
      color: #fff;
      border: none;
      padding: 9px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 229, 255, 0.35);
      transition: all 0.2s ease;
    }
    .btn-reset:hover {
      background: linear-gradient(135deg, #26c6da 0%, #00b8d4 100%);
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.5);
      transform: translateY(-1px);
    }
    .btn-reset:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>单摆简谐振动模拟器</h1>
      <p class="subtitle">Simple Pendulum · SHM &nbsp;|&nbsp; L = 200 px · g = 9.8 m/s² · θ₀ = 45°</p>
    </header>
    <canvas id="canvas"></canvas>

    <div class="control-panel">
      <div class="control-group">
        <div class="control-label">
          <span>摆长 L (Length)</span>
          <span id="lenVal" class="val-display">200 px</span>
        </div>
        <input type="range" id="lenSlider" min="100" max="350" step="1" value="200">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>重力 g (Gravity)</span>
          <span id="gravVal" class="val-display">9.8</span>
        </div>
        <input type="range" id="gravSlider" min="1" max="25" step="0.1" value="9.8">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>阻尼 k (Damping)</span>
          <span id="dampVal" class="val-display">0.0020</span>
        </div>
        <input type="range" id="dampSlider" min="0" max="0.010" step="0.0005" value="0.002">
      </div>

      <button type="button" id="resetBtn" class="btn-reset">重置摆动</button>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      const VIEW_W = 820;
      const VIEW_H = 520;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = VIEW_W * dpr;
      canvas.height = VIEW_H * dpr;
      canvas.style.width = VIEW_W + 'px';
      canvas.style.height = VIEW_H + 'px';
      ctx.scale(dpr, dpr);

      const origin = { x: VIEW_W / 2, y: 96 };
      const PIXELS_PER_METER = 200;
      const INITIAL_ANGLE = Math.PI / 4;

      let length = 200;
      let gravity = 9.8;
      let damping = 0.002;

      const PHYSICS_DT = 1 / 240;
      const MAX_FRAME_DT = 0.05;
      const TRAIL_MAX = 34;
      const BOB_RADIUS = 18;

      let theta = INITIAL_ANGLE;
      let omega = 0;
      let lastTime = performance.now();
      let accumulator = 0;
      const trail = [];

      function stepPhysics(dt) {
        const alpha = -(gravity * PIXELS_PER_METER / length) * Math.sin(theta) - damping * 60 * omega;
        omega += alpha * dt;
        theta += omega * dt;
      }

      function bobPosition() {
        return {
          x: origin.x + length * Math.sin(theta),
          y: origin.y + length * Math.cos(theta)
        };
      }

      function drawBackground() {
        const bg = ctx.createRadialGradient(
          VIEW_W / 2, VIEW_H * 0.42, 60,
          VIEW_W / 2, VIEW_H * 0.42, VIEW_W * 0.75
        );
        bg.addColorStop(0, '#22222e');
        bg.addColorStop(1, '#1a1a24');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }

      function drawReference() {
        ctx.save();
        ctx.setLineDash([5, 7]);
        ctx.strokeStyle = 'rgba(144, 202, 249, 0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(origin.x, origin.y + length + 34);
        ctx.stroke();
        ctx.setLineDash([]);

        const rodAngle = Math.PI / 2 - theta;
        const vertical = Math.PI / 2;
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, 52, Math.min(rodAngle, vertical), Math.max(rodAngle, vertical));
        ctx.stroke();
        ctx.restore();
      }

      function drawTrail() {
        for (let i = 0; i < trail.length; i++) {
          const t = (i + 1) / trail.length;
          const p = trail[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2 + t * 9, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 229, 255, ' + (t * 0.14).toFixed(3) + ')';
          ctx.fill();
        }
      }

      function drawRod(bob) {
        const grad = ctx.createLinearGradient(origin.x, origin.y, bob.x, bob.y);
        grad.addColorStop(0, 'rgba(224, 230, 237, 0.65)');
        grad.addColorStop(1, 'rgba(0, 229, 255, 0.55)');
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(bob.x, bob.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }

      function drawPivot() {
        ctx.fillStyle = '#2c2c3e';
        ctx.fillRect(origin.x - 30, origin.y - 20, 60, 13);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.strokeRect(origin.x - 30, origin.y - 20, 60, 13);

        ctx.save();
        ctx.shadowColor = 'rgba(144, 202, 249, 0.6)';
        ctx.shadowBlur = 10;
        const pin = ctx.createRadialGradient(origin.x - 2, origin.y - 2, 1, origin.x, origin.y, 7);
        pin.addColorStop(0, '#e3f2fd');
        pin.addColorStop(1, '#5c78a8');
        ctx.fillStyle = pin;
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBob(bob) {
        ctx.save();

        const halo = ctx.createRadialGradient(bob.x, bob.y, 4, bob.x, bob.y, 48);
        halo.addColorStop(0, 'rgba(0, 229, 255, 0.28)');
        halo.addColorStop(1, 'rgba(0, 229, 255, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(bob.x, bob.y, 48, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 22;
        const body = ctx.createRadialGradient(
          bob.x - 5, bob.y - 6, 3,
          bob.x, bob.y, BOB_RADIUS
        );
        body.addColorStop(0, '#d9fbff');
        body.addColorStop(0.45, '#4fe3ff');
        body.addColorStop(1, '#0097a7');
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(bob.x - 5, bob.y - 6, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fill();

        ctx.restore();
      }

      function drawHud() {
        const deg = theta * 180 / Math.PI;
        const period = 2 * Math.PI * Math.sqrt((length / PIXELS_PER_METER) / gravity);
        ctx.save();
        ctx.font = '12px Consolas, Menlo, monospace';
        ctx.fillStyle = 'rgba(224, 230, 237, 0.72)';
        ctx.textAlign = 'left';
        ctx.fillText('\u03B8 = ' + deg.toFixed(1) + '\u00B0', 20, 30);
        ctx.fillText('\u03C9 = ' + omega.toFixed(2) + ' rad/s', 20, 48);
        ctx.fillText('L = ' + length + ' px   g = ' + gravity.toFixed(1) + ' m/s\u00B2', 20, 66);
        ctx.fillText('T \u2248 ' + period.toFixed(2) + ' s   k = ' + damping.toFixed(4), 20, 84);
        ctx.restore();
      }

      function draw() {
        drawBackground();
        const bob = bobPosition();
        trail.push({ x: bob.x, y: bob.y });
        if (trail.length > TRAIL_MAX) trail.shift();
        drawReference();
        drawTrail();
        drawRod(bob);
        drawPivot();
        drawBob(bob);
        drawHud();
      }

      function animate(now) {
        let frameDt = (now - lastTime) / 1000;
        lastTime = now;
        if (frameDt > MAX_FRAME_DT) frameDt = MAX_FRAME_DT;
        accumulator += frameDt;
        while (accumulator >= PHYSICS_DT) {
          stepPhysics(PHYSICS_DT);
          accumulator -= PHYSICS_DT;
        }
        draw();
        requestAnimationFrame(animate);
      }

      const lenSlider = document.getElementById('lenSlider');
      const gravSlider = document.getElementById('gravSlider');
      const dampSlider = document.getElementById('dampSlider');
      const lenVal = document.getElementById('lenVal');
      const gravVal = document.getElementById('gravVal');
      const dampVal = document.getElementById('dampVal');
      const resetBtn = document.getElementById('resetBtn');

      lenSlider.addEventListener('input', function (e) {
        length = parseFloat(e.target.value);
        lenVal.textContent = length + ' px';
      });

      gravSlider.addEventListener('input', function (e) {
        gravity = parseFloat(e.target.value);
        gravVal.textContent = gravity.toFixed(1);
      });

      dampSlider.addEventListener('input', function (e) {
        damping = parseFloat(e.target.value);
        dampVal.textContent = damping.toFixed(4);
      });

      resetBtn.addEventListener('click', function () {
        theta = INITIAL_ANGLE;
        omega = 0;
        trail.length = 0;
        accumulator = 0;
      });

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
